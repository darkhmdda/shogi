# Entorno completo: PostgreSQL + API.  Uso: docker compose up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shogi
      POSTGRES_PASSWORD: shogi
      POSTGRES_DB: shogi
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shogi"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://shogi:shogi@db:5432/shogi
      SHOGI_CORS_ORIGINS: http://localhost:5173,http://localhost:4173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
