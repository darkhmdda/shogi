# Despliegue en Render (https://render.com) como "Blueprint".
# En el panel de Render: New → Blueprint → elige este repositorio → Apply.
# Crea la base de datos, la API y la web, y conecta cada servicio con la
# dirección real del otro (aunque Render les añada un sufijo al nombre).
databases:
  - name: shogi-db
    plan: free
    databaseName: shogi
    user: shogi

services:
  - type: web
    name: shogi-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shogi-db
          property: connectionString
      - key: SHOGI_AUTO_CREATE
        value: "0"
      - key: SHOGI_CORS_ORIGINS
        fromService:
          type: web
          name: shogi-web
          property: host

  - type: web
    name: shogi-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shogi-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
