# Despliegue en Render (https://render.com) como "Blueprint".
# Crea la base de datos, la API y la web con un solo clic desde el panel de Render
# (New → Blueprint → este repositorio). Revisa los nombres y la región antes de aplicar.
databases:
  - name: shogi-db
    plan: free
    databaseName: shogi
    user: shogi

services:
  - type: web
    name: shogi-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shogi-db
          property: connectionString
      - key: SHOGI_AUTO_CREATE
        value: "0"
      - key: SHOGI_CORS_ORIGINS
        # Sustituye por la URL definitiva de la web tras el primer despliegue.
        value: https://shogi-web.onrender.com

  - type: web
    name: shogi-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        # Sustituye por la URL definitiva de la API tras el primer despliegue.
        value: https://shogi-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
