name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web y motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:functions
      - name: La Edge Function empaquetada está al día
        run: |
          npm run build:function
          git diff --exit-code supabase/functions/online-move/index.ts
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Tests de interfaz (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
        env:
          CI: "1"

  mobile:
    name: App móvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace mobile
      - run: npx expo export --platform web --output-dir /tmp/mobile-dist
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: "1"
          CI: "1"

  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shogi
          POSTGRES_PASSWORD: shogi
          POSTGRES_DB: shogi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shogi"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Migraciones (ida y vuelta) y modelos sincronizados
        env:
          DATABASE_URL: postgresql://shogi:shogi@localhost/shogi_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: database/schema.sql está actualizado
        run: |
          ./scripts/generate_schema.sh
          git diff --exit-code ../database/schema.sql
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://shogi:shogi@localhost/shogi_test
          TEST_KEEP_SCHEMA: "1"
          SHOGI_AUTO_CREATE: "0"
