name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web y motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  mobile:
    name: App móvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace mobile
      - run: npx expo export --platform web --output-dir /tmp/mobile-dist
        working-directory: apps/mobile
        env:
          EXPO_OFFLINE: "1"
          CI: "1"

  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shogi
          POSTGRES_PASSWORD: shogi
          POSTGRES_DB: shogi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shogi"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: psql postgresql://shogi:shogi@localhost/shogi_test -f ../database/schema.sql
      - run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://shogi:shogi@localhost/shogi_test
          TEST_KEEP_SCHEMA: "1"
