name: Publicar web (GitHub Pages)

# Publica la web en https://<usuario>.github.io/<repositorio>/ en cada push a main.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; no se cancela uno que ya está en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compilar la web para /<repositorio>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Supabase: cuentas, progreso y partidas guardadas. La clave es la
          # pública ("publishable"), pensada para ir dentro de la web; la
          # seguridad la ponen las reglas RLS de supabase/migrations.
          # Se pueden sobrescribir con variables del repositorio
          # (Settings → Secrets and variables → Actions → Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jmojorddnjgxqjnpkvcs.supabase.co' }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY || 'sb_publishable_O5sUEAooXq6wNq9Powzbmg_JzWdMHNY' }}
          # Juego en línea: oculto hasta instalar la migración 2 y la Edge Function.
          VITE_SUPABASE_ONLINE: ${{ vars.VITE_SUPABASE_ONLINE || 'false' }}
      - name: Página 404 (por si alguien entra a una ruta inexistente)
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
