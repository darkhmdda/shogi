name: App Android (APK)

# Compila la app móvil como APK instalable.
# - Al crear una etiqueta "v*" (por ejemplo v1.0.0) publica un release con el APK.
# - Desde Actions → "Run workflow": con una versión (por ejemplo 1.0.0) crea la
#   etiqueta y publica el release; sin versión, solo compila y deja el APK como artefacto.
#
# Firma: si existen los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD se firma con esa clave propia. Si no,
# con la clave genérica de Expo (sirve para instalar y actualizar, pero es pública).
on:
  push:
    tags: ['v*']
    # Compilación de prueba (sin release) al cambiar la app en las ramas de trabajo.
    branches: ['claude/**']
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'scripts/android-*.mjs'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Versión a publicar (por ejemplo 1.0.0). Vacío = solo compilar.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test

      - name: Versión de la app
        id: version
        run: |
          RELEASE_INPUT="${{ github.event.inputs.release }}"
          if [[ -n "$RELEASE_INPUT" ]]; then VERSION="${RELEASE_INPUT#v}"; PUBLISH=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; PUBLISH=true
          else VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"; PUBLISH=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          node scripts/android-version.mjs "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Generar el proyecto Android (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Firma con clave propia (si está configurada)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.keystore
          node scripts/android-signing.mjs

      - name: Compilar el APK
        working-directory: apps/mobile/android
        # Solo procesadores ARM (los de los teléfonos reales): el APK pesa mucho menos.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Nombre del archivo
        id: apk
        run: |
          FILE="shogi-${{ steps.version.outputs.version }}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publicar el release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Si la etiqueta no existe, se crea sobre el commit compilado.
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Shōgi ${{ steps.version.outputs.version }}
          make_latest: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            ## Shōgi ${{ steps.version.outputs.version }} para Android

            **Cómo instalarla:**
            1. Descarga `${{ steps.apk.outputs.file }}` desde el móvil (en "Assets", abajo).
            2. Ábrelo. Si Android lo pide, permite "Instalar apps de fuentes desconocidas" para tu navegador o gestor de archivos.
            3. Pulsa **Instalar**.

            Para actualizar, instala el APK nuevo encima: se conservan tu progreso y tu sesión.

            También puedes usarla sin instalar nada en https://darkhmdda.github.io/shogi/
